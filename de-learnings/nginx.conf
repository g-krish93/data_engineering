server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # The app uses HashRouter with base './', so routing lives after the '#'
    # and any real path resolves to index.html. This fallback is belt-and-braces
    # for a direct hit on an unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets/, so they are safe to
    # cache forever; a new build produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache the HTML entry point, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
